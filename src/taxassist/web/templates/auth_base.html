<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}登录 · 税务智能知识助手{% endblock %}</title>
<style>
/* ── 字体自托管（与 base.html 用同一份子集文件，理由见那里的注释）── */
@font-face{font-family:"Sarasa Mono SC";font-style:normal;font-weight:400;
  font-display:swap;
  src:url("/static/fonts/sarasa-mono-sc-regular.woff2") format("woff2")}
@font-face{font-family:"Sarasa Mono SC";font-style:normal;font-weight:700;
  font-display:swap;
  src:url("/static/fonts/sarasa-mono-sc-bold.woff2") format("woff2")}

/* 认证页独立布局：这一页的使用者还没进来，不需要导航与检索，
   注意力只该集中在一件事上。色板与主界面同源，视觉不脱节。 */
:root{
  --paper:#f4f5f3; --card:#fff; --sunken:#eef0ec;
  --ink:#1c2227; --ink-2:#4d5761; --ink-3:#78828c;
  --line:#dfe2dc; --brand:#1b3a4b; --brand-2:#28556b;
  --bad-bg:#f7e8e8; --bad-fg:#96272c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
header.top{background:var(--brand);color:#fff;height:52px;display:flex;
  align-items:center;padding:0 20px;flex:none}
/* 品牌名不要去动它的收缩行为：**踩过坑** —— 加 min-width:0 + overflow:hidden
   本想"挤的时候省略号"，实测 flex 把品牌名一路压到 0 宽，顶栏只剩一个语言
   按钮。英文名写短（TaxAssist）才是解法，不是让布局去兜。 */
header.top .brand{color:#fff;font-size:14.5px;font-weight:600;letter-spacing:.3px;
  text-decoration:none;white-space:nowrap}
header.top .mode{font-size:10.5px;font-weight:400;letter-spacing:0;
  background:rgba(255,255,255,.13);border:.5px solid rgba(255,255,255,.22);
  border-radius:2px;padding:1px 5px;margin-left:8px;vertical-align:1.5px;
  color:rgba(255,255,255,.8)}
header.top .mode-out{background:rgba(255,214,145,.16);
  border-color:rgba(255,210,130,.42);color:#ffd89a}
/* 语言切换按钮：登录/注册页也要有 —— 未登录访客第一眼看到的就是这一页。
   排版与 base.html 同规矩：**宽度自适应 + 不换行**，不给固定宽度。
   "中文" 是 2 个 CJK 字（约 26px），"EN" 只有 2 个拉丁字母（约 17px），
   给固定宽度就会有一边明显空着或挤着。margin-left:auto 把它推到最右，
   与主站顶栏的位置感一致。

   **必须显式覆盖 width 与 margin-top**：本文件上面有一条给表单提交按钮用的
   `button{width:100%;margin-top:22px}`，它是元素选择器、会命中所有 button。
   不覆盖的话这个按钮会变成 width:100% 的整条横杠 —— 配合 margin-left:auto
   实测从 146px 一路拉到 1377px，把页面撑出横向滚动条。 */
header.top .lang-toggle{margin-left:auto;flex:none;white-space:nowrap;
  width:auto;margin-top:0;
  font:inherit;font-size:12.5px;padding:3px 9px;cursor:pointer;
  border:1px solid #0e3a0e;background:#001a00;color:#00cc00;
  border-radius:0;line-height:1.5}
header.top .lang-toggle:hover{background:#002a00;border-color:#00cc00;
  color:#00ff00}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:56px 20px}
.box{width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);
  border-radius:3px;padding:26px 28px 24px}
h1{font-size:17px;font-weight:600;margin:0 0 6px;letter-spacing:-.1px}
.lede{font-size:12.5px;color:var(--ink-3);margin:0 0 18px;line-height:1.75}
label{display:block;font-size:12px;color:var(--ink-2);margin:14px 0 5px;
  font-weight:500;letter-spacing:.2px}
input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:2px;
  font-family:inherit;font-size:14px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--brand-2)}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.65}
button{width:100%;margin-top:22px;padding:9px;border:0;border-radius:2px;
  background:var(--brand);color:#fff;font-family:inherit;font-size:14px;
  font-weight:500;cursor:pointer}
button:hover{background:var(--brand-2)}
.err{background:var(--bad-bg);color:var(--bad-fg);border:1px solid #e3cccc;
  padding:10px 12px;border-radius:2px;font-size:12.5px;line-height:1.7;margin:0 0 18px}
.alt{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-3);line-height:1.8}
.alt a{color:var(--brand-2);text-decoration:none}
.alt a:hover{text-decoration:underline}
code{font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:12px;
  background:var(--sunken);border:1px solid var(--line);border-radius:2px;padding:1px 5px}

/* =================================================================
   终端主题（覆盖层，写在最后所以生效）
   -----------------------------------------------------------------
   方向：黑底 / 终端绿 / 直角 / 中英混排等宽。
   它取代了原先的「档案工作台」浅色文档风。

   三条刻意的克制（理由见 tools/apply_terminal_theme.py 的文件头）：
     · 语义色保留 —— 效力四态必须能一眼分开
     · 中文不强等宽 —— 等宽字体排前面，中文自动回退
     · 不加扫描线/闪烁 —— 正文是公文，一读几千字
   ================================================================= */
:root{
  --bg:#000; --bg-2:#0a0f0a; --bg-3:#111811;
  --terminal:#00ff00; --terminal-2:#00cc00; --terminal-3:#008800;
  --terminal-4:#005500; --terminal-dim:#0e3a0e; --terminal-dim-2:#082a08;

  /* —— 覆盖原有变量名，让既有规则自动变终端风 —— */
  --paper:#000; --card:#0a0f0a; --sunken:#111811;
  --ink:#00ff00; --ink-2:#00cc00; --ink-3:#008800;
  --line:#0e3a0e; --line-2:#082a08;
  /* **注意 --brand 在原设计里是"顶栏背景"**（原本是深蓝 #1b3a4b），
     不是品牌文字色。我第一次覆盖成 #00ff00，结果整个顶栏变成一块亮绿
     —— 截图一眼就看出来了。这里给它一个很深的绿，顶栏才是黑底绿字；
     顶栏文字色由下面那条 `.brand{color:...}` 单独控制。 */
  --brand:#001a00; --brand-2:#002a00;
  /* 语义色：**刻意保留**，见文件头理由 ① */
  --ok-bg:#003300;  --ok-fg:#00ff00;  --ok-bar:#00cc00;
  --warn-bg:#2a1c00; --warn-fg:#ffb000; --warn-bar:#ffb000;
  --bad-bg:#2a0500;  --bad-fg:#ff5f56;  --bad-bar:#ff3b30;
  --mut-bg:#0d0d0d;  --mut-fg:#4d7a4d;  --mut-bar:#3a5f3a;
}
html,body{background:#000}
::selection{background:#00ff00;color:#000}

/* 字体：**这才是"代码感"的决定因素**。
   之前把中文回退到「微软雅黑」—— 那是现代无衬线，跟终端毫无关系，
   所以只有颜色像、字体不像。实测（canvas 量字符宽度）：
     NSimSun / SimSun 的中英宽度比正好 2.00（标准 CJK 等宽）
     Consolas 1.82 / Cascadia 1.71（只覆盖拉丁，中文仍要回退）
     微软雅黑 1.02（比例字体，完全不是等宽）
   而且宋体在 13px 这种小字号下是**点阵渲染** —— 那个颗粒感正是
   「远古终端」的来源，不是靠调颜色能得到的。

   宋体的硬伤是**拉丁部分为衬线体**（观感"公文"而非"代码"），故改用
   Sarasa Mono SC：更纱黑体等宽，中英同一套设计、严格 2:1。 */
body{font:13px/1.7 "Sarasa Mono SC","Cascadia Mono",Consolas,
  "NSimSun",SimSun,"Courier New",monospace}

/* ── CRT 质感，按 CSS-Tricks《Old Timey Terminal Styling》的做法 ──
   （完整说明见 base.html 的注释：径向渐变发光背景 / text-shadow 荧光晕 /
  扫描线用 absolute+四边显式声明（不用 inset，那会撑开页面）/
  pointer-events:none 保证文字可选中） */
html,body{background:#000}
body{position:relative;min-height:100vh;
  background-image:radial-gradient(rgba(0,150,0,.16),transparent 85%);
  text-shadow:0 0 5px rgba(0,255,0,.45)}
body::after{content:"";position:absolute;top:0;left:0;
  width:100vw;height:100vh;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(0deg,
    rgba(0,0,0,.22) 0 1px, transparent 1px 2px)}
::selection{background:#00ff00;color:#000;text-shadow:none}

/* 滚动条 —— 细节，但它是"运行框"观感的一部分 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#0e3a0e;border:1px solid #000}
::-webkit-scrollbar-thumb:hover{background:#0b4b0b}

/* 直角：终端里没有圆角 */
.card,.pad,.bar,.badge,.src,.row-tag,.evi,textarea,input,button,
select,.ibtn,.chip,.split{border-radius:0}

/* 链接：悬停反色高亮，像终端里选中一段 */
a{color:#00cc00;border-bottom-color:#0e3a0e}
a:hover{background:#00ff00;color:#000;border-bottom-color:#00ff00}

/* 顶栏 */
/* 品牌名不要去动它的收缩行为：**踩过坑** —— 加 min-width:0 + overflow:hidden
   本想"挤的时候省略号"，实测 flex 把品牌名一路压到 0 宽，顶栏只剩一个语言
   按钮。收缩到 0 与"优雅截断"之间的界线不可控，所以不用这招。
   真正的解法是把英文名写短（TaxAssist），而不是让布局去兜。 */
.top{background:#000;border-bottom-color:#0e3a0e}
.top nav a{color:#008800}
.top nav a:hover{background:none;color:#00ff00;
  border-bottom-color:#00ff00}
.brand{color:#00ff00;font-weight:700;letter-spacing:.5px}
.brand:hover{background:none;color:#00ff00}
/* 品牌名后面跟一个闪烁光标 —— 纯 CSS，是"运行框"最省的一个信号 */
.brand::after{content:"_";animation:ta-blink 1.1s step-end infinite}
@keyframes ta-blink{0%,100%{opacity:1}50%{opacity:0}}
.local{background:#001a00;border-color:#0e3a0e;color:#00cc00}
.mode-out{background:#2a1c00;border-color:#4a3200;color:#ffb000}
.quick input{background:#0a0f0a;border-color:#0e3a0e;color:#00ff00}
.quick input::placeholder{color:#005500}
.quick input:focus{background:#001a00;border-color:#00cc00}
.quick button{background:#001a00;border-color:#0e3a0e;color:#00cc00}
.quick button:hover{background:#002a00;color:#00ff00}
.who,.who-login{color:#008800}
.who-name{color:#00ff00}

/* 标题：终端里用提示符前缀，比加粗更贴 */
h1{color:#00ff00}
h1::before{content:"> ";color:#008800}
h2{color:#008800}

/* 卡片与表格 */
.card{background:#0a0f0a;border-color:#0e3a0e}
.bar{background:#0a0f0a;border-color:#0e3a0e}
.bar .cell{border-right-color:#082a08}
table{border-color:#0e3a0e}
th{background:#0d140d;color:#008800;border-color:#0e3a0e}
td{border-color:#082a08}
tr:hover td{background:#0d140d}

/* 表单：终端里的输入位 */
input,textarea,select{background:#0a0f0a;border-color:#0e3a0e;
  color:#00ff00}
input:focus,textarea:focus,select:focus{border-color:#00cc00;outline:none;
  background:#001a00}
input::placeholder,textarea::placeholder{color:#005500}

/* 按钮：主按钮反色（绿底黑字），次按钮描边 */
button,.ibtn{background:#001a00;border-color:#0e3a0e;color:#00cc00}
button:hover,.ibtn:hover{background:#002a00;border-color:#00cc00;
  color:#00ff00}
.ibtn.go{background:#00ff00;color:#000;border-color:#00ff00;
  font-weight:700}
.ibtn.go:hover{background:#00cc00;color:#000}

/* 双语排版：英文原是浅灰，这里改成暗绿 —— 从属关系不变 */
.en{color:#008800}
.en a{color:#008800}
.mt-note{color:#008800;border-left-color:#0e3a0e}

/* 摘要条 / 空态 / 日期分隔 */
.sub,.empty,.hint{color:#008800}
.day{background:#0d140d;color:#00cc00;border-color:#0e3a0e}

/* 快捷筛选（年份/地区的 q-chip） */
.q-chip{background:#0a0f0a;border-color:#0e3a0e;color:#00cc00}
.q-chip:hover{background:#001a00;border-color:#00cc00;color:#00ff00}
.q-chip.on{background:#00ff00;color:#000;border-color:#00ff00;
  font-weight:700}
.f-q-label{color:#008800}

/* 附件原文：终端里的输出区 */
.attach-text{background:#050805;border-color:#0e3a0e;color:#00cc00}

/* 登录/注册页 */
.auth-card,.auth-wrap .card{background:#0a0f0a;border-color:#0e3a0e}

/* 助手对话页：输入区与依据卡 */
.composer{background:#0a0f0a;border-color:#0e3a0e;box-shadow:none}
.msg.user .body{background:#0d140d;border-color:#0e3a0e}
.ans h3{color:#00ff00;border-bottom-color:#0e3a0e}
.ans h4{color:#00cc00}
.ans strong{color:#00ff00}
.evi{background:#0a0f0a;border-color:#0e3a0e}
.evi > summary{background:#0d140d;color:#00cc00;border-bottom-color:#0e3a0e}
.evi .row{border-bottom-color:#082a08}
.fact{border-left-color:#0e3a0e;color:#00cc00}
.group-hd{color:#008800}
.stage{color:#008800}
.stage .dot{background:#00ff00}
.err{background:#2a0500;color:#ff5f56;border-color:#4a1010}
.warn-bar{background:#2a1c00;color:#ffb000;border-color:#4a3200}
.cit{background:#001a00;color:#00ff00}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span data-zh="税务智能知识助手" data-en="TaxAssist">税务智能知识助手</span><span
     class="mode {{ 'mode-out' if exposed else '' }}"
     data-zh="{{ '对外' if exposed else '本地' }}"
     data-en="{{ 'Public' if exposed else 'Local' }}">{{ '对外' if exposed else '本地' }}</span></a>
  {# 语言切换：登录/注册页也要有 —— 未登录访客第一眼看到的就是这一页，
     没有它就只能看中文。#}
  <button type="button" class="lang-toggle" id="lang-toggle"
          data-title-zh="切换界面语言" data-title-en="Switch interface language">EN</button>
</header>
<main>
  <div class="box">
{% block body %}{% endblock %}
  </div>
</main>
{# 与主站共用一份语言脚本：这一页不继承 base.html，所以必须显式引入，
   否则登录/注册页永远只有中文（未登录访客第一眼看的就是这里）。 #}
<script src="/static/lang.js"></script>
</body>
</html>
